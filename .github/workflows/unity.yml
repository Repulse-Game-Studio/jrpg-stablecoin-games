name: unity

# The Unity glue in real Unity editors and players, through GameCI (https://game.ci): the Unity Test
# Framework's edit- and play-mode suites on the oldest supported Unity (6.3 LTS) and on the version the
# dev project is on, then the e2e players built with the dev project's build methods: the Linux IL2CPP
# player (windowed, under xvfb) and the WebGL player (in Chromium), each paying on Anvil (EVM and Arc)
# and on solana-test-validator. The C# core's own tests run without Unity in test.yml (cs-core).
#
# It needs a Unity Personal license in three repository secrets (Settings -> Secrets and variables ->
# Actions -> New repository secret, or `gh secret set <NAME>`): UNITY_LICENSE, the whole contents of the
# account's license file (an XML file; on Linux ~/.local/share/unity3d/Unity/Unity_lic.ulf, written when the
# Hub adds the Personal license), and UNITY_EMAIL and UNITY_PASSWORD, the account's sign-in. GameCI activates
# a seat with the email and password (it reads only the serial from the license file), so the account must
# have no two-factor authentication. Use a Unity account made only for CI: anyone who can push a branch to
# this repository can read the secrets through a changed workflow. (A Plus or Pro license uses UNITY_SERIAL
# with the email and password instead.) GitHub gives no secrets to pull requests from forks, and a
# repository without them skips every Unity job (the "license" job says so) instead of failing. A job
# cancelled or timed out mid-build can leave its seat held: later runs then fail with "No seat available"
# until it expires, or until it is released by signing in at id.unity.com with that account.

on:
  # The same paths on both: what the Unity jobs build or import (the e2e runners reuse the Godot and Ren'Py
  # runners' families, helpers and mocks). The weekly run covers everything else.
  push:
    branches: [main]
    paths:
      - "unity/**"
      - "plugin/game/scfg/web/**"
      - "plugin/game/python-packages/scfg_core/**"
      - "contracts/**"
      - "tools/run_unity_e2e.py"
      - "tools/run_unity_web_e2e.py"
      - "tools/check_unity_samples.py"
      - "tools/run_godot_e2e.py"
      - "tools/run_godot_web_e2e.py"
      - "tools/run_renpy_e2e.py"
      - "tools/run_renpy_web_e2e.py"
      - "tools/sync_demo.py"
      - "tools/fetch_godot.py"
      - "tests/integration/browser_mocks.py"
      - "tests/integration/mock_token.py"
      - "tests/integration/solana_local.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/unity.yml"
  pull_request:
    paths:   # keep in step with push.paths above
      - "unity/**"
      - "plugin/game/scfg/web/**"
      - "plugin/game/python-packages/scfg_core/**"
      - "contracts/**"
      - "tools/run_unity_e2e.py"
      - "tools/run_unity_web_e2e.py"
      - "tools/check_unity_samples.py"
      - "tools/run_godot_e2e.py"
      - "tools/run_godot_web_e2e.py"
      - "tools/run_renpy_e2e.py"
      - "tools/run_renpy_web_e2e.py"
      - "tools/sync_demo.py"
      - "tools/fetch_godot.py"
      - "tests/integration/browser_mocks.py"
      - "tests/integration/mock_token.py"
      - "tests/integration/solana_local.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/unity.yml"
  schedule:
    - cron: "0 7 * * 1"   # weekly, after test.yml: a new runner image or GameCI image shows up here
  workflow_dispatch:

permissions:
  contents: read

# Every Unity job activates the same Unity account (each builder or test-runner step takes a license seat and
# returns it when it ends), so the activations are kept down: one group for the whole workflow, so runs from
# different branches never overlap, and no cancel-in-progress, because a job killed mid-build cannot return its
# seat. Inside a run at most two jobs hold a seat at once: the test legs one after the other beside samples,
# then the two e2e jobs. A newer run waits; GitHub keeps one waiting run per group and cancels an older waiting
# one (it had not started, so it held no seat).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  AGAVE_VERSION: v4.3.0
  UNITY_VERSION: 6000.6.9f1   # unity/Project/ProjectSettings/ProjectVersion.txt
  PROJECT: unity/Project
  # unity-builder runs the game-ci/cli binary, with the Unity credentials in its environment, and without
  # cliVersion it downloads the latest CLI release at every run: the action's SHA pin alone does not pin what
  # runs. This is the release the workflow was checked against (its build check wants the "Build succeeded!"
  # line the build methods log); bump it together with unity-builder, after reading what changed.
  # Not named GAME_CI_*: the CLI reads every GAME_CI_<NAME> variable as its option <name> and refuses one it does
  # not know ("Unknown argument: cli").
  GAMECI_CLI_VERSION: v0.1.76

jobs:
  license:
    # Fork pull requests get no secrets: skip the Unity jobs there, and wherever the secrets are unset.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::UNITY_LICENSE, UNITY_EMAIL or UNITY_PASSWORD is not set: the Unity jobs are skipped"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: license
    if: needs.license.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1   # one seat at a time (see concurrency); samples holds the other
      matrix:
        # 6.3 LTS, the package's minimum; the dev project's version, env.UNITY_VERSION (a matrix cannot read env:
        # change both together, and release.yml's notes too)
        unity: ["6000.3.28f1", "6000.6.9f1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: unity/Project/Library
          key: library-tests-${{ matrix.unity }}-${{ hashFiles('unity/Project/Packages/packages-lock.json') }}
          restore-keys: library-tests-${{ matrix.unity }}-
      - uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT }}
          unityVersion: ${{ matrix.unity }}
          testMode: all   # edit and play mode in one activation
          artifactsPath: artifacts/${{ matrix.unity }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-tests-${{ matrix.unity }}
          path: artifacts/${{ matrix.unity }}
          if-no-files-found: ignore

  samples:
    # The Showcase and Demo samples, imported into the dev project as the Package Manager does,
    # compile and their scenes open (Scfg.Maintenance.ScfgSamplesCheck.Check, run as the build method).
    needs: license
    if: needs.license.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv run --no-project python tools/check_unity_samples.py
      - name: Copy the samples into the dev project
        run: cp -r "unity/Packages/com.repulse.scfg/Samples~" "$PROJECT/Assets/Samples"
      - uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          cliVersion: ${{ env.GAMECI_CLI_VERSION }}
          buildMethod: Scfg.Maintenance.ScfgSamplesCheck.Check
          allowDirtyBuild: true   # the samples' copy is untracked

  linux-e2e:
    # After tests and samples (seats, see concurrency), whatever their result.
    needs: [license, tests, samples]
    if: ${{ !cancelled() && needs.license.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: unity/Project/Library
          key: library-linux-${{ env.UNITY_VERSION }}-${{ hashFiles('unity/Project/Packages/packages-lock.json') }}
          restore-keys: library-linux-${{ env.UNITY_VERSION }}-
      - name: Build the IL2CPP Linux e2e player (Managed Stripping Level High)
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          cliVersion: ${{ env.GAMECI_CLI_VERSION }}
          buildMethod: Scfg.E2E.ScfgE2EBuild.BuildLinux
          customParameters: -scfgBackend il2cpp -scfgOut /github/workspace/build/linux-il2cpp
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - name: Install Agave (solana-test-validator)
        run: |
          curl -sSfL -o /tmp/agave.tar.bz2 \
            "https://github.com/anza-xyz/agave/releases/download/${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar xjf /tmp/agave.tar.bz2 -C /tmp
          echo /tmp/solana-release/bin >> "$GITHUB_PATH"
      - run: uv sync
      - name: Make the player runnable (the build container wrote it as root)
        run: sudo chown -R "$USER" build && chmod +x build/linux-il2cpp/scfg-e2e.x86_64
      # Windowed under xvfb, so the screens are drawn too (the local runs are -batchmode -nographics).
      - name: Linux IL2CPP e2e (EVM)
        run: SCFG_E2E_WINDOWED=1 uv run python tools/run_unity_e2e.py --player build/linux-il2cpp --family evm
      - name: Linux IL2CPP e2e (Arc, native USDC send)
        run: SCFG_E2E_WINDOWED=1 uv run python tools/run_unity_e2e.py --player build/linux-il2cpp --family arc
      - name: Linux IL2CPP e2e (Solana)
        run: SCFG_E2E_WINDOWED=1 uv run python tools/run_unity_e2e.py --player build/linux-il2cpp --family solana

  webgl-e2e:
    # After tests and samples (seats, see concurrency), whatever their result.
    needs: [license, tests, samples]
    if: ${{ !cancelled() && needs.license.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: unity/Project/Library
          key: library-webgl-${{ env.UNITY_VERSION }}-${{ hashFiles('unity/Project/Packages/packages-lock.json') }}
          restore-keys: library-webgl-${{ env.UNITY_VERSION }}-
      - name: Build the WebGL e2e player (IL2CPP, Managed Stripping Level High, uncompressed)
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          cliVersion: ${{ env.GAMECI_CLI_VERSION }}
          buildMethod: Scfg.E2E.ScfgE2EBuild.BuildWebGL
          customParameters: -scfgOut /github/workspace/build/webgl
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - name: Install Agave (solana-test-validator)
        run: |
          curl -sSfL -o /tmp/agave.tar.bz2 \
            "https://github.com/anza-xyz/agave/releases/download/${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar xjf /tmp/agave.tar.bz2 -C /tmp
          echo /tmp/solana-release/bin >> "$GITHUB_PATH"
      - run: uv sync
      - run: sudo chown -R "$USER" build
      # Playwright drives the runner's preinstalled Google Chrome (run_godot_e2e.launch_chromium).
      - name: WebGL e2e (EVM)
        run: uv run python tools/run_unity_web_e2e.py --player build/webgl --family evm
      - name: WebGL e2e (Arc, native USDC send)
        run: uv run python tools/run_unity_web_e2e.py --player build/webgl --family arc
      - name: WebGL e2e (Solana)
        run: uv run python tools/run_unity_web_e2e.py --player build/webgl --family solana
