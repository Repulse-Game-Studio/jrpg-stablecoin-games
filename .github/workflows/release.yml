name: release

# Push a tag like v0.1.0 to publish the drop-in archives (dist/scfg-renpy-<version>.zip,
# dist/scfg-godot-<version>.zip, dist/scfg-rpgmaker-mz-<version>.zip and the Unity package
# dist/scfg-unity-<version>.tgz) as a GitHub release and the stablecoin-games-renpy installer to
# PyPI and npm. The tag must match scfg_core.__version__; tools/package.py also refuses a Godot
# plugin.cfg, RPG Maker version.ts or Unity package.json that differs from it. The Unity editor
# suites and e2e need a Unity license and run in unity.yml (on main), not here.
# PyPI and npm use trusted publishing: no token is stored here. Each registry's stablecoin-games-renpy
# package trusts this repository, this workflow file and its environment ("pypi", "npm").
# The Unreal plugin ships as three zips, dist/scfg-unreal-<version>-ue5.6.zip, -ue5.7.zip and -ue5.8.zip (one per
# engine version), and its optional showcase sample as dist/scfg-unreal-showcase-<version>.zip; tools/package.py
# refuses a Scfg.uplugin or ScfgShowcase.uplugin VersionName that differs from scfg_core.__version__. Its
# editor builds, automation tests and e2e need Unreal Engine and run in unreal.yml (on a self-hosted runner), not here.
# Neither editor workflow runs on a tag: before tagging, check that unity.yml and unreal.yml ran green on the tagged
# commit, or run their suites locally (README.md, "Releasing").
# The tests and the archives run in the build job, which can only read the repository; the release job, the only
# one that may write to it, runs no repository code: it takes build's dist/ and publishes it with gh.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24   # the RPG Maker zip runs npm run build
      - run: npm ci
        working-directory: rpgmaker
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
      - name: TypeScript core and RPG Maker glue tests (test.yml does not run on tags)
        run: npm test
        working-directory: rpgmaker
      - name: Install Ninja and the locales the C++ core's LocaleTests rerun both tiers under
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build locales
          sudo locale-gen tr_TR.UTF-8 de_DE.UTF-8
      - name: C++ core (Unreal) tests against the conformance vectors (test.yml does not run on tags)
        working-directory: unreal
        env:
          SCFG_REQUIRE_LOCALES: "1"   # LocaleTests fails, rather than falls back to another locale, without them
        run: |
          cmake --preset release
          cmake --build --preset release
          ctest --preset release
      - name: Download Godot (the supported floor)
        run: uv run --no-project python tools/fetch_godot.py --version 4.3-stable --dest /tmp/godot
      - name: Import the Godot project (registers the class_name globals)
        run: /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path godot --import
      - name: GDScript tests against the conformance vectors (test.yml does not run on tags)
        run: uv run --no-project python tools/run_godot_tests.py --godot /tmp/godot/Godot_v4.3-stable_linux.x86_64
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: C# core and localhost server tests against the conformance vectors (test.yml does not run on tags)
        run: dotnet test unity/Scfg.sln -c Release
      # The localhost checkout server security suite on every server, as test.yml's jobs run it. The uv run pytest
      # above ran the default: the Python part, and the C# part with the runner image's preinstalled dotnet (it skips
      # without one); it skipped the Godot part (no SCFG_GODOT then) and deselected the Node and C++ parts. Each part
      # but the Python one runs here on its own, failing rather than skipping when its toolchain is missing.
      - name: Localhost checkout server security suite, C# server (Unity)
        env:
          SCFG_REQUIRE_CS: "1"   # fails, rather than skips, without dotnet
        run: uv run pytest tests/server_security -m cs_server
      - name: Localhost checkout server security suite, C++ server (Unreal)
        env:
          SCFG_REQUIRE_CPP: "1"   # fails, rather than skips, without cmake, a compiler or ninja
        run: uv run pytest tests/server_security -m cpp_server
      - name: Localhost checkout server security suite, Node server (RPG Maker's desktop page)
        env:
          SCFG_REQUIRE_JS: "1"   # fails, rather than skips, without Node or rpgmaker/node_modules
        run: uv run pytest tests/server_security -m node_server
      - name: Localhost checkout server security suite, GDScript server (Godot)
        env:
          SCFG_REQUIRE_GD: "1"   # the Godot part fails, rather than skips, without a binary
          SCFG_GODOT: /tmp/godot/Godot_v4.3-stable_linux.x86_64
        run: uv run pytest tests/server_security -m godot_server

      - name: Tag matches the plugin version
        id: version
        run: |
          version=$(uv run python -c "import sys; sys.path.insert(0, 'plugin/game/python-packages'); from scfg_core import __version__; print(__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match scfg_core.__version__ ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the Unreal zips (one per engine version, 5.6, 5.7 and 5.8, and the showcase sample's)
        run: uv run python tools/package.py --engine unreal

      - name: Build the release archives
        run: |
          uv run python tools/package.py
          uv run python tools/package.py --engine godot
          uv run python tools/package.py --engine rpgmaker
          uv run python tools/package.py --engine unity
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
    steps:
      # Only for CHANGELOG.md and gh's repository; no credential is left in .git/config (gh uses GH_TOKEN).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Only versions like 0.4.0rc1 are prereleases; GitHub's "latest" (and the jrpg.com page) skips those.
          prerelease=""
          case "$VERSION" in *[a-z]*) prerelease="--prerelease" ;; esac
          # gh puts these lines above the generated notes (what changed since the last tag). The tested versions are
          # unreal.yml's engine (UE 5.8.4) and unity.yml's UNITY_VERSION (6000.6.9f1): change them together.
          cat > /tmp/notes.md <<NOTES
          Pick the archive for your engine: unzip a zip into your project folder; add the Unity \`.tgz\` in the Package Manager as it is, without unpacking it.

          - \`scfg-renpy-$VERSION.zip\`: Ren'Py 8.2+ (or run \`uvx stablecoin-games-renpy install .\` in the project)
          - \`scfg-godot-$VERSION.zip\`: Godot 4.3+ (preview). Install it from the editor's AssetLib tab with Import..., or copy the \`addons\` folder inside it into your project
          - \`scfg-unreal-$VERSION-ue5.x.zip\`: Unreal Engine 5.6+ (preview, tested on UE 5.8.4 on Linux desktop, and built with MSVC on Windows). Pick the zip for your engine version (\`-ue5.6\`, \`-ue5.7\` or \`-ue5.8\`) and unzip it into your project's \`Plugins/\` folder
          - \`scfg-unreal-showcase-$VERSION.zip\`: optional, the Unreal showcase sample (a one-screen tour of the API on testnets) for a spare project; its folder goes next to the plugin's in \`Plugins/\`, and its README says how to wire it
          - \`scfg-rpgmaker-mz-$VERSION.zip\`: RPG Maker MZ (preview, not yet tested in real RPG Maker MZ)
          - \`scfg-unity-$VERSION.tgz\`: Unity 6.3 LTS+ (preview, tested on Unity 6000.6.9f1, Linux, Windows and WebGL players). In the Package Manager: + > Add package from tarball, or + > Add package from git URL with \`https://github.com/$GITHUB_REPOSITORY.git?path=unity/Packages/com.repulse.scfg#$GITHUB_REF_NAME\`

          Install guides: https://jrpg.com/stablecoinforgames/docs/
          NOTES
          # this version's CHANGELOG.md section (its "## <version>" heading up to the next one) goes on top
          awk -v h="## $VERSION" '$0 == h { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > /tmp/changes.md
          # A blank line between the two: the section can end on a list item (the file's last line, or one right above
          # the next heading), and without it Markdown reads the install lines as more of that item.
          if [ -s /tmp/changes.md ]; then { cat /tmp/changes.md; echo; cat /tmp/notes.md; } > /tmp/all-notes.md && mv /tmp/all-notes.md /tmp/notes.md; fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/scfg-renpy-$VERSION.zip" \
            "dist/scfg-godot-$VERSION.zip" \
            "dist/scfg-unreal-$VERSION-ue5.6.zip" \
            "dist/scfg-unreal-$VERSION-ue5.7.zip" \
            "dist/scfg-unreal-$VERSION-ue5.8.zip" \
            "dist/scfg-unreal-showcase-$VERSION.zip" \
            "dist/scfg-rpgmaker-mz-$VERSION.zip" \
            "dist/scfg-unity-$VERSION.tgz" \
            --title "Stablecoin for Games $VERSION" \
            --notes-file /tmp/notes.md \
            --generate-notes $prerelease

  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write   # trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv build
      - name: Package carries the plugin
        run: |
          unzip -l dist/*.whl | grep -q "scfg_renpy/plugin/game/scfg/scfg_api.rpy"
          unzip -l dist/*.whl | grep -q "scfg_renpy/plugin/game/python-packages/scfg_core/__init__.py"
          ! unzip -l dist/*.whl | grep -E "__pycache__|\.rpyc$"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  npm:
    needs: release
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write   # trusted publishing and provenance
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24   # npm 11.5+ for trusted publishing
          registry-url: https://registry.npmjs.org
      - run: npm test
      - name: Version from the tag
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: npm publish --provenance --access public
