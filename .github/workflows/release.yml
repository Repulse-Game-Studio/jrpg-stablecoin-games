name: release

# Push a tag like v0.1.0 to publish dist/scfg-renpy-<version>.zip as a GitHub release and
# the scfg-renpy installer to PyPI and npm. The tag must match scfg_core.__version__.
# PyPI and npm use trusted publishing: no token is stored here. Each registry's scfg-renpy
# package trusts this repository, this workflow file and its environment ("pypi", "npm").

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest

      - name: Tag matches the plugin version
        run: |
          version=$(uv run python -c "import sys; sys.path.insert(0, 'plugin/game/python-packages'); from scfg_core import __version__; print(__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match scfg_core.__version__ ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: uv run python tools/package.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only versions like 0.2.0rc1 are prereleases; GitHub's "latest" (and the jrpg.com page) skips those.
          prerelease=""
          case "$VERSION" in *[a-z]*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "dist/scfg-renpy-$VERSION.zip" \
            --title "Stablecoin for Games $VERSION" \
            --generate-notes $prerelease

  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write   # trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv build
      - name: Package carries the plugin
        run: |
          unzip -l dist/*.whl | grep -q "scfg_renpy/plugin/game/scfg/scfg_api.rpy"
          unzip -l dist/*.whl | grep -q "scfg_renpy/plugin/game/python-packages/scfg_core/__init__.py"
          ! unzip -l dist/*.whl | grep -E "__pycache__|\.rpyc$"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  npm:
    needs: release
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write   # trusted publishing and provenance
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24   # npm 11.5+ for trusted publishing
          registry-url: https://registry.npmjs.org
      - run: npm test
      - name: Version from the tag
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: npm publish --provenance --access public
