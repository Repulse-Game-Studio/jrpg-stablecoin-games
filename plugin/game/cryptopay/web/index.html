<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Checkout</title>
  <style>
    :root, :host { color-scheme: light; --bg: #e9edf1; --sheet: #fbfcfd; --ink: #17202e; --muted: #5b6676;
            --line: #cfd5dd; --rule: #e4e8ed; --hover: #eef1f4; --accent: #0e7c74; --on-accent: #ffffff;
            --ok: #17804f; --warn: #9a5b00; --bad: #c0392b; }
    * { box-sizing: border-box; }
    body, .cp-body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 0;
           background: var(--bg); color: var(--ink);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(440px, 92vw); background: var(--sheet); border-radius: 16px; padding: 30px 34px 26px;
           box-shadow: 0 20px 50px rgba(23, 32, 46, .14); }
    #logo { display: block; max-width: 240px; max-height: 64px; margin-bottom: 18px; }
    h1 { font-size: 22px; line-height: 1.25; margin: 0; }
    .amount { font-size: 38px; font-weight: 700; line-height: 1.2; margin-top: 4px;
              font-variant-numeric: tabular-nums; }
    .amount .token { font-size: 20px; font-weight: 400; color: var(--muted); margin-left: 4px; }
    .meta { color: var(--muted); font-size: 15px; margin: 0; }
    .testnet { display: inline-block; margin-top: 8px; padding: 2px 8px; border-radius: 6px;
               background: #fdf1d8; color: var(--warn); font-size: 13px; font-weight: 600; }
    #wallets { display: grid; gap: 9px; margin: 20px 0 0; }
    button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 14px;
             border-radius: 10px; border: 1.5px solid var(--line); background: #fff; color: var(--ink);
             font: inherit; font-weight: 700; text-align: left; cursor: pointer; }
    button:hover:not(:disabled) { background: var(--hover); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    button:disabled { opacity: .5; cursor: default; }
    button.primary { justify-content: center; margin-top: 14px; background: var(--accent);
                     border-color: var(--accent); color: var(--on-accent); }
    button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
    button img { width: 28px; height: 28px; border-radius: 6px; }
    #status { display: flex; gap: 10px; align-items: baseline; margin-top: 18px; padding-top: 14px;
              border-top: 1.5px solid var(--rule); font-size: 15px; min-height: 40px; }
    #status::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%;
                      background: var(--accent); transform: translateY(1px); }
    #status.ok::before { background: var(--ok); } #status.ok { color: var(--ok); }
    #status.warn::before { background: var(--warn); } #status.warn { color: var(--warn); }
    #status.bad::before { background: var(--bad); } #status.bad { color: var(--bad); }
    .foot { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
    .hidden { display: none !important; }
    a { color: var(--accent); }
    code { word-break: break-all; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <img id="logo" class="hidden" alt="">
    <h1 id="title">Loading…</h1>
    <div class="amount" id="amount"></div>
    <p class="meta"><span id="subtitle"></span> <span id="network"></span></p>
    <div id="testnet" class="testnet hidden">Testnet: no real money</div>

    <div id="wallets"></div>
    <button id="pay" class="primary hidden" type="button"></button>

    <div id="status">Looking for wallets in this browser…</div>
    <p class="foot" id="footer">This page is served by the game on your own computer.
      The payment goes directly from your wallet to the developer.</p>
  </main>
  <script src="evm.js"></script>
  <script src="solana.js"></script>
  <script src="app.js"></script>
</body>
</html>
