[project]
name = "scfg-renpy"
dynamic = ["version"]   # scfg_core.__version__, the single source
description = "USDC/USDT tips and unlocks for Ren'Py games, paid wallet to wallet. Installs the plugin into your project."
readme = "installer/README.md"
license = "MIT"
license-files = ["LICENSE"]
# Ren'Py 8.2/8.3 embed Python 3.9: all plugin code must stay 3.9-compatible.
requires-python = ">=3.9"
dependencies = []
keywords = ["renpy", "ren'py", "visual-novel", "usdc", "usdt", "stablecoin", "payments", "tips",
            "game-monetization", "solana", "ethereum", "base", "arbitrum", "polygon", "arc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://jrpg.com/stablecoinforgames/"
Documentation = "https://jrpg.com/stablecoinforgames/docs/"
Source = "https://github.com/Repulse-Game-Studio/jrpg-stablecoin-games"
Changelog = "https://github.com/Repulse-Game-Studio/jrpg-stablecoin-games/releases"

[project.scripts]
scfg-renpy = "scfg_renpy.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "plugin/game/python-packages/scfg_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["installer/scfg_renpy"]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.rpyc", "**/*.rpymc"]

# The plugin ships inside the package; `scfg-renpy install` copies it into a game.
[tool.hatch.build.targets.wheel.force-include]
"plugin/game" = "scfg_renpy/plugin/game"

[tool.hatch.build.targets.sdist]
include = ["installer/", "plugin/game/", "LICENSE", "README.md", "pyproject.toml"]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.rpyc", "**/*.rpymc"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "playwright>=1.60.0",
    "solders==0.27.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["plugin/game/python-packages", "installer"]
testpaths = ["tests"]
markers = [
    "integration: needs a local Anvil node (Foundry); run with -m integration",
    "live: reads real public chains (read-only, no key); run with -m live",
]
addopts = "-m 'not integration and not live'"

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["plugin/game/python-packages", "installer", "tests"]
extend-exclude = [  # vendored third-party code, kept identical to upstream
    "plugin/game/python-packages/scfg_core/_xkcp.py",
    "plugin/game/python-packages/scfg_core/_qrcodegen.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["scfg_core"]
known-local-folder = ["fakes", "mock_token", "conftest", "solana_local", "browser_mocks",
                      "test_browser_checkout"]
