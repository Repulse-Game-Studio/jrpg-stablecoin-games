[project]
name = "stablecoin-games-renpy"
dynamic = ["version"]   # scfg_core.__version__, the single source
description = "Stablecoin for Games (SCFG): USDC/USDT tips and unlocks for Ren'Py games, paid straight to your wallet. No server, no tokens, no NFTs. Installs the plugin into your project."
readme = "installer/README.md"
license = "MIT"
license-files = ["LICENSE"]
# Ren'Py 8.2/8.3 embed Python 3.9: all plugin code must stay 3.9-compatible.
requires-python = ">=3.9"
dependencies = []
keywords = ["stablecoin-for-games", "stablecoin-games", "stablecoinforgames", "scfg", "renpy", "ren'py", "visual-novel", "usdc", "usdt", "stablecoin", "payments", "tips",
            "game-monetization", "solana", "ethereum", "base", "arbitrum", "polygon", "arc",
            "crypto", "web3", "donations", "monetization", "wallet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://jrpg.com/stablecoinforgames/"
Documentation = "https://jrpg.com/stablecoinforgames/docs/"
Source = "https://github.com/Repulse-Game-Studio/jrpg-stablecoin-games"
Changelog = "https://github.com/Repulse-Game-Studio/jrpg-stablecoin-games/releases"

[project.scripts]
stablecoin-games-renpy = "scfg_renpy.cli:main"
scfg-renpy = "scfg_renpy.cli:main"   # the package's old name, kept so old instructions work

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "plugin/game/python-packages/scfg_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["installer/scfg_renpy"]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.rpyc", "**/*.rpymc"]

# The plugin ships inside the package; `stablecoin-games-renpy install` copies it into a game.
[tool.hatch.build.targets.wheel.force-include]
"plugin/game" = "scfg_renpy/plugin/game"

[tool.hatch.build.targets.sdist]
include = ["installer/", "plugin/game/", "LICENSE", "README.md", "pyproject.toml"]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.rpyc", "**/*.rpymc"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "playwright>=1.60.0",
    "solders==0.27.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["plugin/game/python-packages", "installer", "conformance/python"]
# tests/server_security runs in the default run: its Python third always, its Godot third (marker
# godot_server) when SCFG_GODOT names a Godot 4.3+ binary (skipped otherwise; SCFG_REQUIRE_GD=1
# makes that a failure). Its Node third (marker node_server) and tests/rpgmaker_ui (marker
# rpgmaker_ui) need Node 22.18+ and rpgmaker/node_modules: the default run deselects them. Naming
# their directory on the command line, or SCFG_REQUIRE_JS=1, selects them again (unless -m is given
# on the command line). CI: unit runs the default (the Python third); godot-core runs
# `-m godot_server` per Godot version; rpgmaker-ui runs tests/rpgmaker_ui and `-m node_server` once.
testpaths = ["tests", "conformance/tests"]
markers = [
    "integration: needs a local Anvil node (Foundry); run with -m integration",
    "live: reads real public chains (read-only, no key); run with -m live",
    "rpgmaker_ui: the RPG Maker sheet in headless Chrome (needs Node and rpgmaker/node_modules); run with -m rpgmaker_ui",
    "node_server: the Node third of tests/server_security (needs Node and rpgmaker/node_modules); run with -m node_server",
    "godot_server: the Godot third of tests/server_security (needs SCFG_GODOT); run alone with -m godot_server",
]
addopts = "-m 'not integration and not live and not rpgmaker_ui and not node_server'"

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["plugin/game/python-packages", "installer", "tests", "conformance/python"]
extend-exclude = [  # vendored third-party code, kept identical to upstream
    "plugin/game/python-packages/scfg_core/_xkcp.py",
    "plugin/game/python-packages/scfg_core/_qrcodegen.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["scfg_core", "scfg_conformance"]
known-local-folder = ["fakes", "mock_token", "conftest", "solana_local", "browser_mocks",
                      "test_browser_checkout", "server_handles"]
