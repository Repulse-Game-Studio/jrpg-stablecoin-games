; The development project's engine settings, committed so that a local, untracked ini cannot silently change how the
; editor builds and runs the tests: anything the project needs goes here, in git.

; The editor's Home panel checks the internet connection with a GET of https://www.google.com/generate_204 every 5 s
; (SHomeScreen::CheckInternetConnection, MainFrame/Private/HomeScreen/SHomeScreen.cpp:939-967). Our editor runs stay
; on localhost, so the panel is off (a read-only cvar, MainFrameModule.cpp:54-59, set from here); ScfgDev.NoTelemetry
; checks it.
[ConsoleVariables]
HomeScreen.EnableHomeScreen=0

; The showcase (the ScfgShowcase plugin, unreal/Plugins/ScfgShowcase: ScfgShowcase.h): its game instance (which picks
; its own game mode, so the automation tests' game instances are unaffected) on the engine's empty Entry map, so the
; project needs no content of its own: the showcase has no level. A project that installs the showcase zip sets the
; same two in Project Settings > Maps & Modes (its README.md). tools/run_unreal_e2e.py plays it.
[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
GameInstanceClass=/Script/ScfgShowcase.ScfgShowcaseGameInstance

; libcurl verifies the TLS peer only when the SSL module found root certificates, unless n.VerifyPeer says otherwise
; (CurlHttpManager.cpp:277-289): True makes every HTTPS request of the game fail without verification instead of running
; unverified. The plugin's transport refuses its own https:// RPC requests in that case anyway
; (FScfgHttpTransport::TlsVerificationProblem); this is the setting docs/developers/unreal/install.md recommends for a
; game, kept here so the showcase runs as a shipped game should.
[/Script/Engine.NetworkSettings]
n.VerifyPeer=True
