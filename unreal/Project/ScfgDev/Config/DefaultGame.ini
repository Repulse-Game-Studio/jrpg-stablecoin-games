; The development project's game settings.

; tools/run_unreal_e2e.py --packaged cooks the showcase with BuildCookRun. The engine's default stores the cooked output
; in the per-user zen server (BaseGame.ini: bUseZenStore=True), which auto-launch starts listening on every interface
; and may restart when another editor's runs it; our cooks write loose files instead, staged into the pak, and run with
; -NoZenAutoLaunch and a DDC graph without zen.
[/Script/UnrealEd.ProjectPackagingSettings]
bUseZenStore=False
; Additional Non-Asset Directories to Package (relative to Content/): the showcase's logo (Content/Showcase/logo.png,
; the SCFG settings' Logo below) is a loose file, which the cooker does not stage; without this a packaged showcase's
; Configure() fails with logo.file_missing (docs/developers/unreal/api.md, "The logo in a packaged game").
+DirectoriesToAlwaysStageAsUFS=(Path="Showcase")

; The showcase's configuration without code (unreal/Plugins/ScfgShowcase, ScfgShowcase.h, CONFIGURATION; README.md): the
; SCFG project settings (Project Settings > Plugins > SCFG, UScfgSettings), which the plugin applies when the game
; instance starts. Testnet (Sepolia, Arbitrum Sepolia, Amoy, Base Sepolia, Arc Testnet), so no real money moves. The
; wallet is the public EIP-55 example address, a placeholder for the tests: it is not yours, so a real payment to it
; would be lost; put your own testnet wallet here (or in the panel, or start with -scfg-showcase-wallet=0x...) to watch
; a test payment arrive. The showcase plugin itself has no wallet: in a project whose settings have none it configures
; nothing and says so. No Solana wallet: the start then checks nothing over the network (a Solana wallet makes it look
; up the wallet's token account). The logo is staged by the packaging section above.
; UScfgShowcaseGameInstance::ConfigureInCode holds the same items and accent, and takes this wallet from here, for
; -scfg-showcase-code.
[/Script/Scfg.ScfgSettings]
Options=(Wallet="0x52908400098527886E0F7030069857D2E4169EE7",bTestnet=True,Accent="#7c5cff",Logo="Content/Showcase/logo.png")
+Items=(Id="chapter2",Code=1,Price="1.00",Token="USDC",Title="Chapter 2: The Fall")
+Items=(Id="soundtrack",Code=2,Price="0.50",Token="USDC",Title="Original soundtrack")
+Items=(Id="supporter",Code=3,Price="2.00",Token="USDC",Title="Supporter pack")
