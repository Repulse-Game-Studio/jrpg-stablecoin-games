; The development project's game settings.

; tools/run_unreal_e2e.py --packaged cooks the showcase with BuildCookRun. The engine's default stores the cooked output
; in the per-user zen server (BaseGame.ini: bUseZenStore=True), which auto-launch starts listening on every interface
; and may restart when another editor's runs it (notes/unreal-port/engine-facts.md, "Network of a headless editor run");
; our cooks write loose files instead, staged into the pak, and run with -NoZenAutoLaunch and a DDC graph without zen.
[/Script/UnrealEd.ProjectPackagingSettings]
bUseZenStore=False

; The showcase's configuration without code (Source/ScfgDev/ScfgShowcase.h, CONFIGURATION; README.md): the SCFG project
; settings (Project Settings > Plugins > SCFG, UScfgSettings), which the plugin applies when the game instance starts.
; Testnet (Sepolia, Arbitrum Sepolia, Amoy, Base Sepolia, Arc Testnet), so no real money moves. The wallet is the
; public EIP-55 example address: it is not yours, so a real payment to it would be lost; put your own testnet wallet
; here (or in the panel) to watch a test payment arrive. No Solana wallet: the start then checks nothing over the
; network (a Solana wallet makes it look up the wallet's token account). UScfgShowcaseGameInstance::ConfigureInCode
; holds the same values, for -scfg-showcase-code.
[/Script/Scfg.ScfgSettings]
