; The development project's editor settings, committed. Our editor runs stay off the network beyond localhost, so the
; two telemetry defaults of BaseEditorSettings.ini (both True) are off here:
; - bSendUsageData: the editor's usage analytics (AnalyticsET to datarouter.ol.epicgames.com,
;   UEditorEngine::AreEditorAnalyticsEnabled, EditorServer.cpp:1231);
; - bSendUnattendedBugReports: an unattended run that crashes starts CrashReportClient, which uploads the report
;   (UnixPlatformCrashContext.cpp:785-813: CRC is skipped only when unattended and both upload settings are off).
; ScfgDev.NoTelemetry checks the values the running editor sees.
[/Script/UnrealEd.AnalyticsPrivacySettings]
bSendUsageData=False

[/Script/UnrealEd.CrashReportsPrivacySettings]
bSendUnattendedBugReports=False
